name: gbrain gated build

on:
  pull_request:
  push:
    branches:
      - "harvey/**"
      - "kia/**"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: gbrain-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Run #4369 regression tests
        run: bun test test/sync-anchor-4369.test.ts

      - name: Run source-isolation gate
        run: bun run check:test-isolation

      - name: Build candidate
        run: bun build --compile --outfile bin/gbrain-linux-x64 src/cli.ts

      - name: Record candidate digest
        run: sha256sum bin/gbrain-linux-x64 | tee gbrain-artifact.sha256

      - name: Attest candidate artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: bin/gbrain-linux-x64

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gbrain-gate-evidence-${{ github.sha }}
          path: |
            gbrain-artifact.sha256
            bin/gbrain-linux-x64
